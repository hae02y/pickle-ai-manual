<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">자격 증명 사용 전 접근 로그 기록 순서</title><desc id="d">요청 이후 node가 S3 Object Lock에 기록하고 성공 응답을 받은 뒤 자격 증명을 쓰며 기기에서 검증하는 순서</desc><rect width="1000" height="280" fill="#f6f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="20" y="65" width="190" height="100" rx="12" fill="#deebfa"/><text x="115" y="106" font-size="18">사용 요청</text><text x="115" y="137" font-size="14">연결·Vault 사용</text><rect x="255" y="65" width="190" height="100" rx="12" fill="#e2f4e5"/><text x="350" y="106" font-size="18">node 서명·암호화</text><text x="350" y="137" font-size="14">이전 해시 연결</text><rect x="490" y="65" width="210" height="100" rx="12" fill="#fff0cf"/><text x="595" y="106" font-size="18">S3 Object Lock</text><text x="595" y="137" font-size="14">저장 성공 응답</text><rect x="745" y="65" width="235" height="100" rx="12" fill="#fce5e5"/><text x="862" y="106" font-size="18">자격 증명 사용</text><text x="862" y="137" font-size="14">성공 결과는 별도 확인</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M210 115h45m190 0h45m210 0h45"/></g><g fill="#475569"><path d="m245 108 10 7-10 7m235-14 10 7-10 7m235-14 10 7-10 7"/></g><text x="30" y="235" font-family="Arial,sans-serif" font-size="15" fill="#475569">기기 앱은 저장된 항목의 서명·체인을 검증한다. 로그는 시도 기록이며 외부 작업의 완료 증명은 아니다.</text></svg>
