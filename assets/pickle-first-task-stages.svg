<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">피클 첫 작업의 세 단계</title><desc id="desc">후보 찾기에서 문의와 예약 확정으로 진행할수록 허용 행동과 필요한 증거가 달라진다</desc><rect width="1100" height="310" fill="#f7f9fc"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="30" y="55" width="275" height="170" rx="18" fill="#dfeeff" stroke="#7aa6d9" stroke-width="2"/><text x="168" y="100" font-size="25" fill="#17365d">1 후보 찾기</text><text x="168" y="140" font-size="18" fill="#334155">검색·비교만 허용</text><text x="168" y="177" font-size="16" fill="#475569">증거: 출처·가격·위치</text><rect x="412" y="55" width="275" height="170" rx="18" fill="#fff1d6" stroke="#d6aa52" stroke-width="2"/><text x="550" y="100" font-size="25" fill="#6d4700">2 문의하기</text><text x="550" y="140" font-size="18" fill="#334155">웹 문의·전화 범위 지정</text><text x="550" y="177" font-size="16" fill="#475569">증거: 대상·답변·연결 여부</text><rect x="795" y="55" width="275" height="170" rx="18" fill="#e4f4e6" stroke="#74b684" stroke-width="2"/><text x="932" y="100" font-size="25" fill="#245337">3 확정하기</text><text x="932" y="140" font-size="18" fill="#334155">예약·결제 조건 검토</text><text x="932" y="177" font-size="16" fill="#475569">증거: 확정번호·업체 기록</text></g><g stroke="#64748b" stroke-width="4" fill="none"><path d="M305 140h107m275 0h108"/></g><g fill="#64748b"><path d="m396 129 16 11-16 11m383-22 16 11-16 11"/></g><text x="550" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">다음 단계로 넘어갈 때마다 사용자가 허용 범위와 완료 증거를 새로 정한다.</text></svg>
