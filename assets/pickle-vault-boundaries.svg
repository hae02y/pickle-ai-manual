<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">Vault 비밀 정보의 신뢰 경계</title><desc id="d">기기 키에서 enclave와 작업 실행자, 외부 사이트까지 값이 이동하는 경로</desc><rect width="1000" height="280" fill="#f6f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="20" y="60" width="220" height="135" rx="12" fill="#deebfa"/><text x="130" y="100" font-size="19">기기</text><text x="130" y="130" font-size="15">Keychain · 마스터 키</text><text x="130" y="158" font-size="15">attestation 검증</text><rect x="300" y="60" width="240" height="135" rx="12" fill="#e2f4e5"/><text x="420" y="100" font-size="19">Nitro Enclave node</text><text x="420" y="130" font-size="15">위임 키 · 토큰 · TOTP seed</text><text x="420" y="158" font-size="15">사용 전 로그 기록</text><rect x="600" y="60" width="175" height="135" rx="12" fill="#fff0cf"/><text x="687" y="100" font-size="19">worker · 브라우저</text><text x="687" y="130" font-size="15">Vault 값 수신 가능</text><text x="687" y="158" font-size="15">한 필드씩 release</text><rect x="835" y="60" width="145" height="135" rx="12" fill="#fce5e5"/><text x="907" y="100" font-size="19">외부 사이트</text><text x="907" y="130" font-size="15">로그인 · 결제</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M240 125h60m240 0h60m175 0h60"/></g><g fill="#475569"><path d="m290 118 10 7-10 7m290-14 10 7-10 7m225-14 10 7-10 7"/></g><text x="30" y="245" font-family="Arial,sans-serif" font-size="15" fill="#475569">암호화·attestation의 보호 범위는 release 이후 worker와 사이트까지 자동 확장되지 않는다.</text></svg>
